<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catchall</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Catchall">
<meta name="theme-color" content="#eaeef4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1119" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pad-green desk ruled with the computation pad's grid; a deep green header; notes are light sheets; every day, sheet and Board column opens with a ruled title block.
   Ink is graphite. Red pencil is spent only on Save, Delete and what's due; non-photo blue marks pins, selection and focus. */
:root{
  --bg:#dfe8d2; --grid:#cbdabb; --surface:#f8fbf3; --surface-2:#e9f0df; --fg:#242b25; --muted:#526056; --line:#c3d3b4;
  --shell:#2f5a3c; --shell-2:#264b31; --shell-fg:#eef5e6; --shell-muted:#b9cdb4; --rule:#3d7350;
  --red:#c2392a; --red-fg:#ffffff; --blue:#1f74a3; --blue-wash:#d3ecf7;
  --accent:var(--blue); --accent-fg:#ffffff; --hi:var(--blue-wash); --danger:var(--red); --ok:#2e7d4f;
  --sh-rgb:36 60 40;
  --shell-ok:#7bd88f; --shell-err:#ff8a78; --shell-err-fg:#ffd0c8; --shell-line:rgb(255 255 255/.24);
  --scrim:rgb(20 32 22/.55); --photo-bg:#000000; --photo-scrim:rgb(0 0 0/.65); --photo-fg:#ffffff;
  --font-display:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-legible:"Barlow", "Segoe UI", system-ui, sans-serif;
  --font-hyper:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-type:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-body:var(--font-legible);
  --r:12px; --gap:12px; --pad:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141b15; --grid:#1c261d; --surface:#1d261e; --surface-2:#253027; --fg:#e2eadb; --muted:#9db0a0; --line:#334237;
  --shell:#1f3a27; --shell-2:#18301f; --shell-fg:#e2eadb; --shell-muted:#9fb9a3; --rule:#5d9a70;
  --red:#ff7a66; --red-fg:#1a0d0a; --blue:#6cc4ea; --blue-wash:#173c4b;
  --accent:var(--blue); --accent-fg:#0b1a21; --hi:var(--blue-wash); --danger:var(--red); --ok:#5cc489; --sh-rgb:0 0 0; --scrim:rgb(0 0 0/.62); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#141b15; --grid:#1c261d; --surface:#1d261e; --surface-2:#253027; --fg:#e2eadb; --muted:#9db0a0; --line:#334237;
  --shell:#1f3a27; --shell-2:#18301f; --shell-fg:#e2eadb; --shell-muted:#9fb9a3; --rule:#5d9a70;
  --red:#ff7a66; --red-fg:#1a0d0a; --blue:#6cc4ea; --blue-wash:#173c4b;
  --accent:var(--blue); --accent-fg:#0b1a21; --hi:var(--blue-wash); --danger:var(--red); --ok:#5cc489; --sh-rgb:0 0 0; --scrim:rgb(0 0 0/.62); color-scheme:dark; }
:root[data-font="grotesk"]{ --font-body:var(--font-hyper); }
:root[data-font="mono"]{ --font-body:var(--font-type); }
:root[data-density="compact"]{ --gap:8px; --pad:10px; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin-right:auto}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.brand-mark svg{width:21px;height:21px}
.views{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px}
.views button{border:0;background:none;padding:6px 11px;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(var(--sh-rgb)/.12)}
.views .badge{background:var(--red);color:var(--red-fg);border-radius:99px;font:500 11px/1 var(--font-display);padding:3px 5px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--fg)}
.sync{display:flex;align-items:center;gap:6px;font:12px var(--font-display);color:var(--muted)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"]::before{background:var(--ok)}
.sync[data-s="error"]::before,.sync[data-s="autherr"]::before,.sync[data-s="noscope"]::before{background:var(--danger)}
.sync[data-s="error"],.sync[data-s="autherr"],.sync[data-s="noscope"]{color:var(--danger);font-weight:500}
/* phones show only the dot when all is well, and the words when something needs attention */
@media (max-width:640px){ .sync[data-s="synced"] span,.sync[data-s="connecting"] span{display:none} }
.sync-diag{font:12px/1.5 var(--font-display);color:var(--muted);margin:0}
.sync-err{background:color-mix(in srgb,var(--danger) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));border-radius:8px;padding:8px 10px;font-size:14px;margin:0}

main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
.col{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.col .col{width:100%}

/* composer */
.composer{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 10px;transition:border-color .15s}
.composer:focus-within{border-color:var(--accent)}
.composer.drag{border-style:dashed;border-color:var(--accent)}
#cap{width:100%;border:0;background:none;resize:none;outline:none;font-size:18px;line-height:1.45;min-height:30px;max-height:50vh;padding:2px 4px}
#cap::placeholder{color:var(--muted)}
.comp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.preview{display:flex;flex-wrap:wrap;gap:6px;margin-right:auto;min-width:0}
.pv{font:12px/1 var(--font-display);padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.pv .i{width:13px;height:13px}
.pv.rem{background:color-mix(in srgb,var(--hi) 30%,var(--surface));color:var(--fg)}
.ghost{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center}
.ghost:hover{color:var(--fg);background:var(--surface-2)}
.dict-hint{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--hi) 30%,var(--surface));color:var(--fg);border-radius:8px;padding:8px 10px;margin:6px 0 0;font-size:14px}
.dict-hint .i{margin-top:2px}
.dict-hint span{flex:1}
.act.mic[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--red-fg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.armed{background:var(--red);color:var(--red-fg);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:var(--photo-scrim);color:var(--photo-fg);display:grid;place-items:center;padding:0}
.thumb button .i{width:12px;height:12px}
.hint{font-size:13px;color:var(--muted);margin:2px 4px 0}
.hint kbd{font:11px var(--font-display);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}

/* tag bar + filters */
.tagbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{--c:var(--muted);flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .n{font:11px var(--font-display);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip.add{border-style:dashed;color:var(--muted)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-width:0}
.search input{flex:1;border:0;background:none;outline:none;padding:8px 0;min-width:0}
.fsel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;font-size:14px}
.ftog{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.ftog .i{width:14px;height:14px}
.ftog[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

/* feed */
.day{display:flex;flex-direction:column;gap:var(--gap)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad) var(--pad) 10px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.note.arch{opacity:.7}
.note.colored{background:color-mix(in srgb,var(--nc) 22%,var(--surface));border-color:color-mix(in srgb,var(--nc) 60%,var(--line))}
.swatches{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.nswatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--nc);padding:0}
.nswatch.none{background:linear-gradient(135deg,transparent 45%,var(--muted) 45% 55%,transparent 55%),var(--surface)}
.nswatch[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.n-actions .ghost.del:hover{color:var(--danger)}
.note.dragging{opacity:.4}
.n-body{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.n-body a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.n-title{font-weight:700}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.items li{display:flex;gap:8px;align-items:flex-start}
.cbox{flex:none;width:20px;height:20px;margin-top:2px;border-radius:6px;border:1.5px solid var(--muted);background:none;display:grid;place-items:center;padding:0;color:var(--accent-fg)}
.cbox .i{width:13px;height:13px;stroke-width:3}
.cbox[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.items li.done span{text-decoration:line-through;color:var(--muted)}
.items li .n-body{flex:1;min-width:0}
.item-x{padding:2px;margin-left:auto}
.item-x .i{width:15px;height:15px}
@media (hover:hover){ .item-x{opacity:0} .items li:hover .item-x,.item-x:focus-visible{opacity:1} }
.n-imgs{display:flex;gap:6px;flex-wrap:wrap}
.n-imgs button{border:0;padding:0;background:none;border-radius:8px;overflow:hidden;width:min(220px,100%);aspect-ratio:4/3;max-width:100%}
.n-imgs img{width:100%;height:100%;object-fit:cover;display:block}
.n-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.n-meta time{font:12px var(--font-display)}
.tg{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--fg)}
.tg .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.rem-pill{display:inline-flex;align-items:center;gap:5px;font:12px var(--font-display);padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--hi) 28%,transparent);color:var(--fg)}
.rem-pill .i{width:13px;height:13px}
.rem-pill.sent{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.rem-pill.due{background:var(--red);color:var(--red-fg)}
.linkchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--fg);text-decoration:none;max-width:100%}
.linkchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-actions{display:flex;gap:2px;justify-content:flex-end;margin:-4px -6px -4px 0}

.n-actions{flex-wrap:wrap;gap:6px;margin:2px 0 0;justify-content:flex-start}
.act{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:5px 9px;font-size:13px;line-height:1}
.act .i{width:15px;height:15px}
.act:hover{border-color:var(--muted)}
.act[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.tagsel{padding:0 0 0 9px;position:relative}
.tagsel select{border:0;background:none;color:inherit;font:inherit;padding:5px 6px 5px 0;max-width:160px;cursor:pointer;outline:none}
.tagsel:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.act.del{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.note.colored .act{background:color-mix(in srgb,var(--surface) 80%,transparent)}
.pin-flag .i{width:15px;height:15px}
.note.pinned .n-body{padding-right:20px}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.empty h3{font:700 22px/1.2 var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}
.tries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px}
.try{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.try code{font:13px var(--font-display);color:var(--fg);overflow-wrap:anywhere}
.try small{color:var(--muted);font-size:13px}
.try:hover{border-color:var(--accent)}
.more{align-self:center}

/* board */
.board-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.board-head h2{font:700 20px var(--font-display);margin:0 auto 0 0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.bcol{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px;border:1.5px solid transparent}
.bcol.over{border-color:var(--accent);border-style:dashed}
.bcol.archive{background:none;border:1.5px dashed var(--line);justify-content:center;align-items:center;color:var(--muted);font-size:14px;text-align:center}
.bcol .note{cursor:grab}
.n-actions.mv{justify-content:flex-start}
.picker{display:flex;gap:6px;flex-wrap:wrap}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head h2{font:700 26px var(--font-display);margin:0 auto 0 4px;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:88px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.out{opacity:.45}
.cell.today .dnum{background:var(--accent);color:var(--accent-fg)}
.cell[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dnum{font:500 12px var(--font-display);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.cell .snip{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .marks{display:flex;gap:4px;align-items:center;margin-top:auto;font:11px var(--font-display);color:var(--muted)}
.cell .bell{display:inline-flex;align-items:center;gap:2px;color:var(--fg);background:color-mix(in srgb,var(--hi) 40%,transparent);border-radius:4px;padding:0 4px}
.cell .bell .i{width:11px;height:11px}
@media (max-width:640px){ .cell{min-height:54px;padding:4px} .cell .snip{display:none} }
.cal-day{margin-top:18px}

/* reminders */
.rlist h2{font:700 20px var(--font-display);margin:0 0 4px}
.rsec{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rrow .n-actions,.rrow .swatches{flex-basis:100%}
.rrow.colored{background:color-mix(in srgb,var(--nc) 22%,var(--surface));border-color:color-mix(in srgb,var(--nc) 60%,var(--line))}
.rrow .when{font:13px var(--font-display);min-width:0;flex:none;width:150px;color:var(--muted)}
.rrow .what{flex:1;min-width:0;overflow-wrap:anywhere}
.rrow.overdue{border-color:color-mix(in srgb,var(--hi) 70%,var(--line));background:color-mix(in srgb,var(--hi) 14%,var(--surface))}
.rrow.sent .what{text-decoration:line-through;color:var(--muted)}
@media (max-width:560px){ .rrow .when{width:auto} .rrow .what{flex-basis:100%;order:-1} }

/* dialogs */
dialog{border:0;border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:18px}
.dlg h2{font:700 20px var(--font-display);margin:0;display:flex;align-items:center;justify-content:space-between}
.dlg label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.dlg textarea,.dlg input[type=text],.dlg input[type=datetime-local],.dlg select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--fg);font-size:16px;width:100%;min-width:0}
.dlg textarea{min-height:140px;resize:vertical;line-height:1.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.dlg-foot .left{margin-right:auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:6px;padding:5px 10px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(var(--sh-rgb)/.12)}
.set-sec{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,110px) auto;gap:6px;align-items:center}
.trow input{padding:6px 8px!important;font-size:14px!important}
.swatch{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--c)}
.small{font-size:13px;color:var(--muted);margin:0}
.lightbox{width:auto;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);background:var(--photo-bg);border:0;padding:0;display:flex;flex-direction:column}
.lightbox:not([open]){display:none}
.lb-bar{display:flex;justify-content:flex-end;gap:8px;padding:8px;flex:none}
.lb-pic{overflow:auto;flex:1 1 auto;min-height:0;display:grid;place-items:center}
.lightbox img{display:block;max-width:calc(100vw - 32px);max-height:calc(100dvh - 96px);cursor:zoom-in}
.lightbox.zoomed{width:calc(100vw - 32px);height:calc(100dvh - 32px)}
.lightbox.zoomed .lb-pic{place-items:start}
.lightbox.zoomed img{max-width:none;max-height:none;cursor:zoom-out}
img.loading{background:var(--surface-2)}

/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;width:min(460px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 24px rgb(var(--sh-rgb)/.25);animation:up .2s ease-out}
.toast.alarm{background:var(--red);color:var(--red-fg)}
.toast .msg{flex:1;min-width:0;overflow-wrap:anywhere}
.toast button{border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:4px 9px;font-size:13px;opacity:.9}
@keyframes up{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }


/* ---------- Engineer's computation pad ---------- */
html{background:var(--bg)}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);background-size:20px 20px;background-position:-1px -1px;font-size:16px;line-height:1.5;caret-color:var(--red)}
::selection{background:var(--blue-wash);color:var(--fg)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{scrollbar-color:color-mix(in srgb,var(--muted) 55%,transparent) transparent}
b,strong{font-weight:600}

/* shell: the pad's green header band */
.top{background:var(--shell);color:var(--shell-fg);border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 2px 8px -2px rgb(var(--sh-rgb)/.35)}
.brand{font:700 24px/1 var(--font-display);letter-spacing:-.01em;color:var(--shell-fg)}
.brand-mark{background:var(--shell-2);box-shadow:inset 0 0 0 1px var(--shell-line)}
.views{background:var(--shell-2);box-shadow:none;border-radius:10px;padding:3px}
.views button{color:var(--shell-muted);font:600 15px/1 var(--font-display);padding:8px 12px;border-radius:8px}
.views button:hover{color:var(--shell-fg)}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(var(--sh-rgb)/.3)}
.views .badge{background:var(--red);color:var(--red-fg);font:700 11px/1 var(--font-display);padding:3px 6px;font-variant-numeric:tabular-nums}
.sync{font:500 13px var(--font-display);color:var(--shell-muted)}
.sync::before{background:var(--shell-muted)}
.sync[data-s="synced"]::before{background:var(--shell-ok)}
.sync[data-s="error"],.sync[data-s="autherr"],.sync[data-s="noscope"]{color:var(--shell-err-fg)}
.sync[data-s="error"]::before,.sync[data-s="autherr"]::before,.sync[data-s="noscope"]::before{background:var(--shell-err)}
.top .icon-btn{background:transparent;border-color:var(--shell-line);color:var(--shell-fg)}
.top .icon-btn:hover{background:var(--shell-2)}

/* sheets: one elevation, by shadow, no outline */
.composer,.note,.rrow,.cell,dialog{border:0;background:var(--surface);box-shadow:0 1px 2px rgb(var(--sh-rgb)/.14), 0 6px 16px -8px rgb(var(--sh-rgb)/.30)}
.composer{border-radius:14px;padding:14px 14px 12px}
.composer:focus-within{box-shadow:0 1px 2px rgb(var(--sh-rgb)/.14), 0 10px 24px -10px rgb(var(--sh-rgb)/.38), 0 0 0 2px var(--blue)}
#cap{font:400 19px/1.45 var(--font-body)}
#cap::placeholder{color:var(--muted)}
.note{border-radius:var(--r);padding:var(--pad) var(--pad) 12px;gap:10px}
.note.colored,.rrow.colored{background:color-mix(in srgb,var(--nc) 24%,var(--surface))}
.n-body{font-size:17px;line-height:1.45}
.n-title{font:600 17px/1.45 var(--font-body)}
.n-meta{font-size:13px;gap:8px}
.n-meta time{font:500 14px var(--font-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.tg{font:600 13px/1 var(--font-display);padding:4px 9px;border-radius:6px;background:transparent;border:1.5px solid color-mix(in srgb,var(--c) 70%,var(--fg));color:var(--fg)}
.tg .dot{width:7px;height:7px}
.rem-pill{font:600 13px/1 var(--font-display);font-variant-numeric:tabular-nums;padding:4px 8px;background:var(--blue-wash);color:var(--fg);border-radius:6px}
.rem-pill.due{background:var(--red);color:var(--red-fg)}
.rem-pill.sent{background:var(--surface-2);color:var(--muted)}
.cbox[aria-checked="true"]{background:var(--blue);border-color:var(--blue)}

/* the title block: the signature. Ruled in the pad's green ink, it heads each day, sheet and column. */
.day{gap:var(--gap)}
.tblock{display:flex;align-items:stretch;flex-wrap:wrap;border:1.5px solid var(--rule);border-radius:4px;background:color-mix(in srgb,var(--surface) 70%,transparent);margin-top:10px;overflow:hidden}
.tblock h2{font:700 18px/1 var(--font-display);margin:0;padding:9px 14px;flex:1 1 auto;color:var(--fg);text-wrap:balance}
.tb-cell{display:flex;align-items:center;gap:5px;padding:9px 14px;border-left:1.5px solid var(--rule);font:500 14px/1 var(--font-display);color:var(--muted);white-space:nowrap}
.tb-cell b{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.tb-cell.due{background:var(--red);color:var(--red-fg);border-left-color:var(--red)}
.tb-cell.due b{color:var(--red-fg)}

/* controls: plain, labeled, one shape */
.act,.btn{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:8px;font:500 14px/1 var(--font-body);box-shadow:none;background-image:none}
.act{padding:7px 10px}
.act:hover,.btn:hover{border-color:var(--muted);background:var(--surface-2)}
.act:active,.btn:active{background:var(--surface-2);transform:none}
.act[aria-pressed="true"]{color:var(--blue);border-color:var(--blue);background:var(--blue-wash)}
.act.del,.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.act.del:hover,.btn.danger:hover{background:var(--red);border-color:var(--red);color:var(--red-fg)}
.note.colored .act,.rrow.colored .act{background:color-mix(in srgb,var(--surface) 75%,transparent)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-fg);font-weight:700;box-shadow:0 1px 2px rgb(var(--sh-rgb)/.25)}
.btn.primary:hover{background:color-mix(in srgb,var(--red) 86%,var(--fg));border-color:transparent}
.btn.armed{background:var(--red);color:var(--red-fg);border-color:var(--red)}
.act.mic[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--red-fg)}
.tagsel{padding:0 0 0 10px}
.tagsel select{font:600 14px/1 var(--font-display);padding:7px 6px 7px 0}
.ghost{color:var(--muted)}
.icon-btn{border-radius:8px;box-shadow:none}

/* filters */
.chip{font:600 14px/1 var(--font-display);padding:7px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);box-shadow:none}
.chip .n{font:500 12px var(--font-display);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--shell);border-color:var(--shell);color:var(--shell-fg)}
.chip[aria-pressed="true"] .n{color:var(--shell-muted);opacity:1}
.chip.add{background:transparent;border-style:dashed;border-color:var(--muted)}
.search,.fsel,.ftog{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:none}
.search:focus-within{border-color:var(--blue)}
.ftog{font:500 14px var(--font-body);color:var(--muted)}
.ftog[aria-pressed="true"]{color:var(--blue);border-color:var(--blue);background:var(--blue-wash)}
.pv{font:600 13px/1 var(--font-display);background:var(--surface-2);color:var(--muted);border-radius:6px}
.pv.rem{background:var(--blue-wash);color:var(--fg)}
.hint{font-size:13px}
.empty{border:1.5px dashed var(--rule);background:color-mix(in srgb,var(--surface) 60%,transparent);border-radius:14px}
.empty h3{font:700 26px/1.15 var(--font-display)}
.try{border-radius:8px;box-shadow:none}
.try code{font:600 14px var(--font-display)}
.try:hover{border-color:var(--blue)}

/* Board: each column is a pad sheet with its own title block */
.board-head h2,.cal-head h2,.rlist h2{font:700 26px/1.1 var(--font-display);letter-spacing:-.01em}
.bcol{background:color-mix(in srgb,var(--surface-2) 85%,transparent);border:1.5px solid var(--rule);border-radius:var(--r);box-shadow:none;padding:0 10px 12px;gap:12px;overflow:hidden}
.bcol .note{rotate:none}
.bcol.over{border:1.5px dashed var(--blue);background:var(--blue-wash)}
.bcol.archive{background:transparent;border:1.5px dashed var(--muted);padding:12px}

/* calendar */
.cal .dow{font:600 13px var(--font-display);color:var(--muted);padding:4px 6px}
.cell{border-radius:8px}
.cell.out{box-shadow:none;background:color-mix(in srgb,var(--surface) 50%,transparent)}
.dnum{font:600 14px var(--font-display);font-variant-numeric:tabular-nums}
.cell.today .dnum{background:var(--blue);color:var(--accent-fg)}
.cell[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue)}
.cell .marks{font:500 12px var(--font-display)}
.cell .bell{background:var(--blue-wash)}

/* reminders: a fixed time column, digits lined up like a schedule */
.rrow{border-radius:var(--r);padding:12px 14px}
.rrow .when{width:8.5rem;display:flex;flex-direction:column;gap:2px;color:var(--muted);font:500 13px/1.2 var(--font-display)}
.rrow .when b{font:700 20px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--fg)}
.rrow.overdue{background:color-mix(in srgb,var(--red) 10%,var(--surface))}
.rrow.overdue .when b{color:var(--red)}

/* dialogs, settings, toasts */
dialog{border-radius:14px;box-shadow:0 24px 60px -20px rgb(var(--sh-rgb)/.55)}
dialog::backdrop{background:var(--scrim)}
.dlg h2{font:700 24px/1.1 var(--font-display)}
.set-sec h3{margin:0;font:700 16px var(--font-display);color:var(--fg)}
.seg{background:var(--surface-2)}
.seg button{font:600 14px var(--font-display)}
.sync-diag{font:500 13px/1.5 var(--font-display);font-variant-numeric:tabular-nums}
.toast{background:var(--fg);color:var(--bg);border-radius:10px}
.toast.alarm{background:var(--red);color:var(--red-fg)}
.dict-hint{background:var(--blue-wash);color:var(--fg)}
.n-actions{align-items:center}
.act,.tagsel{min-height:36px}
.tagsel select{height:34px;line-height:1.2;padding:0 6px 0 0}
.tagbar{scrollbar-width:none}
.tagbar::-webkit-scrollbar{display:none}
@media (max-width:640px){
  .tblock h2{font-size:17px;padding:8px 12px}
  .tb-cell{padding:8px 10px;font-size:13px}
  .rrow .when{width:auto;flex-direction:row;align-items:baseline;gap:8px}
}

/* review fixes: full-height grid, labeled header and controls on phones, ruled sheets */
body{min-height:100vh}
.top .icon-btn{width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font:600 14px var(--font-display)}
.composer .comp-row{border-top:1px solid var(--line);padding-top:10px}
.n-actions.mv > span{gap:6px;flex-wrap:wrap}
.mvbtn{padding:7px 8px;font:600 13px var(--font-display);max-width:9rem}
.mvbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-head .btn{gap:4px}
.bcol .bhead{margin:0 -10px;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;background:var(--surface)}
.bcol .bhead h2{margin:0;padding:9px 12px;border:0;background:none;flex:1 1 auto;display:flex;align-items:center}
.rsec .tblock{margin-top:16px}
.rlist .tblock h2{font:700 18px/1 var(--font-display);margin:0}
.rrow .when{width:6.5rem}
.board{scrollbar-color:var(--rule) transparent}
.picker{align-items:center}
.picker-lbl{font:600 14px var(--font-display);color:var(--muted);margin-right:2px}
.picker .chip[aria-pressed="true"]{background:var(--blue-wash);border-color:var(--blue);color:var(--fg)}
.ftoggle{display:none}
@media (max-width:640px){
  .top-in{row-gap:8px}
  .views{order:3;width:100%}
  .views button{flex:1 1 0;justify-content:center;padding:8px 4px;font-size:14px;gap:4px}
  .views button .i{display:none}
  .ftoggle{display:inline-flex}
  .filters{flex-wrap:wrap}
  .filters .search{flex:1 1 0;min-width:0}
  .filters:not(.open) .ftog,.filters:not(.open) .fsel{display:none}
  .filters.open .ftog,.filters.open .fsel{flex:1 1 auto}
}

/* ---------- calm pass: desk layout, page headers, ruled action bands, the calendar as one sheet ---------- */
/* page header: the view's name in a large title block */
.pagehead{margin:0 0 16px;background:var(--surface)}
.pagehead h1{font:700 26px/1 var(--font-display);margin:0;padding:12px 16px;flex:1 1 auto;color:var(--fg);letter-spacing:-.01em}
.pagehead .tb-cell{padding:0 16px;font-size:16px}
.ph-ctl{display:flex;align-items:center;gap:6px;padding:6px 10px;border-left:1.5px solid var(--rule)}
.col .pagehead,.desk-head .pagehead{margin:0}

/* desk layout: capture, then tags and filters, then the feed; on wide screens the tags and filters become a rail */
.desk{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "cap" "rail" "feed";gap:16px;max-width:760px;margin:0 auto}
.desk-head{grid-area:head}.desk-cap{grid-area:cap}.rail{grid-area:rail;display:flex;flex-direction:column;gap:12px;min-width:0}.desk-feed{grid-area:feed;gap:14px}
@media (max-width:640px){ .desk-head{display:none} }
@media (min-width:1024px){
  .desk{max-width:none;grid-template-columns:248px minmax(0,1fr);grid-template-areas:"head head" "rail cap" "rail feed";column-gap:28px;align-items:start}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1.5px solid var(--rule);border-radius:4px;padding:0 0 12px;gap:0;max-height:calc(100vh - 100px);overflow:auto}
  .rail .tagbar{flex-direction:column;gap:0;overflow:visible;padding:8px 8px 10px;border-bottom:1px solid var(--line)}
  .rail .tagbar::before{content:"Tags";font:700 16px/1 var(--font-display);padding:6px 8px 10px;color:var(--fg)}
  .rail .chip{justify-content:flex-start;width:100%;border:0;background:none;border-radius:6px;padding:8px;font-size:16px}
  .rail .chip .n{margin-left:auto;font-size:13px}
  .rail .chip:hover{background:var(--surface-2)}
  .rail .chip[aria-pressed="true"]{background:var(--blue-wash);color:var(--fg)}
  .rail .chip[aria-pressed="true"] .n{color:var(--fg)}
  .rail .chip.add{color:var(--muted);margin-top:4px}
  .rail .filters{flex-direction:column;align-items:stretch;gap:6px;padding:12px 16px 0}
  .rail .filters::before{content:"Show only";font:700 16px/1 var(--font-display);padding:2px 0 4px;color:var(--fg)}
  .rail .search{order:-1;flex:none;margin:0 0 6px}
  .rail .filters::before{order:0}
  .rail .ftog,.rail .fsel{width:100%;justify-content:flex-start;border:0;background:none;padding:7px 8px;border-radius:6px;font-size:16px}
  .rail .ftog:hover{background:var(--surface-2)}
  .rail .ftog[aria-pressed="true"]{background:var(--blue-wash);color:var(--fg)}
  .rail .fsel{border:1px solid var(--line);background:var(--surface)}
}
.desk-feed .day:first-child .tblock{margin-top:0}
.desk .desk-feed{max-width:none;margin:0;width:100%}

/* note card: the text leads; time, tag and actions share one ruled band */
.note{gap:10px;padding:16px 16px 10px}
.n-body{max-width:70ch}
.n-band{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;border-top:1px solid var(--line);padding-top:8px}
.n-band .n-meta{border:0;padding:0;gap:8px;min-width:0}
.n-actions{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:0 -6px 0 auto;justify-content:flex-end}
.n-actions .act{border:0;background:none;border-radius:6px;color:var(--muted);font:500 14px/1 var(--font-body);padding:8px 9px;min-height:34px;gap:5px}
.n-actions .act:hover{background:color-mix(in srgb,var(--surface-2) 80%,transparent);color:var(--fg)}
.n-actions .act + .act{position:relative}
.n-actions .act + .act::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--line)}
.n-actions .act:hover::before,.n-actions .act:hover + .act::before{opacity:0}
.n-actions .act[aria-pressed="true"]{background:none;color:var(--blue)}
.n-actions .act.del{color:var(--red);margin-left:8px}
.n-actions .act.del::before{display:none}
.n-actions .act.del:hover{background:var(--red);color:var(--red-fg)}
.note.colored .n-actions .act,.rrow.colored .n-actions .act{background:none}
.n-meta .tagsel{min-height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 0 0 8px;color:var(--fg)}
.n-meta .tagsel select{height:28px;font:600 13px/1 var(--font-display)}
.n-moves{display:flex;flex-wrap:wrap;gap:6px}
.n-moves .act{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px/1 var(--font-display);padding:6px 9px;min-height:32px;border-radius:6px}
.n-moves .act:hover{border-color:var(--muted)}
@media (hover:none){ .n-actions .act{min-height:40px} }
@media (max-width:640px){
  .n-band{flex-direction:column;align-items:stretch}
  .n-actions{margin:0 -6px;justify-content:space-between}
  .n-actions .act{padding:8px 6px;font-size:13px}
  .n-actions .act.del{margin-left:0}
}

/* Board: column name at title size, a colour dot, count in a ruled cell */
.board-head{margin:0 0 12px}
.bcol .bhead h2{font:700 17px/1.1 var(--font-display);gap:8px}
.cdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.bcol .note{padding:14px 14px 8px}
.bcol .n-band{flex-direction:column;align-items:stretch}
.bcol .n-actions{justify-content:flex-start;margin:0 -6px}
.bcol .n-actions .act.del{margin-left:auto}
.bcol.archive{align-self:stretch;min-height:200px}

/* Calendar: one ruled sheet, hairline days, counts in words */
.cal{gap:0;background:var(--surface);border:1.5px solid var(--rule);border-radius:4px;overflow:hidden}
.cal .dow{padding:8px 10px;background:var(--surface-2);border-bottom:1.5px solid var(--rule);font:700 14px var(--font-display);color:var(--fg)}
.cell{border-radius:0;box-shadow:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;min-height:96px;padding:8px}
.cal > :nth-child(7n){border-right:0}
.cell:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.cell.out{background:color-mix(in srgb,var(--surface-2) 60%,transparent);box-shadow:none}
.cell.out .dnum{color:var(--muted);font-weight:500}
.cell[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue)}
.cell .snip{font-size:13px;color:var(--fg)}
.cell .marks{flex-wrap:wrap;gap:4px 8px;font:600 12px/1.2 var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}
.cell .bell{background:var(--blue-wash);color:var(--fg);padding:2px 6px;border-radius:4px}
@media (max-width:640px){ .cell{min-height:58px;padding:5px} .cell .marks{font-size:12px} .cal .dow{padding:6px 4px;font-size:12px} }

/* Reminders */
.rhint{margin:-4px 2px 0}
.rrow .n-band{flex-basis:100%;flex-direction:row}
.rrow .n-band .n-actions{flex-basis:auto}

/* small fixes */
#q::placeholder{color:var(--muted)}
@media (max-width:640px){ .preview .hint{display:none} }
.btn.shell{background:var(--shell);border-color:var(--shell);color:var(--shell-fg);font-weight:600}
.btn.shell:hover{background:var(--shell-2)}
.btn.quiet-del{border-color:transparent;background:none;color:var(--red)}
.btn.quiet-del:hover{background:var(--red);color:var(--red-fg)}
.dlg a{color:var(--blue);text-underline-offset:2px}

  let db = null, user = null;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch(e){}
  if (!db || !user){ setSync('local'); return; }
  let id = null; try { id = await user.id(); } catch(e){}
  if (!id){ setSync('local'); return; }
  try { sync.col = db.collection('data/users/' + id); } catch(e){ setSync('local'); return; }

}
function onRemote(snap){
  const seen = new Set(); let changed = false;
  for (const d of snap.docs){
    const v = d.data(); if (!v) continue;
    seen.add(d.id);
    if (d.id === 'tags'){
      const ru = v.updatedAt || 0;
      if (ru > S.tagsUpdatedAt){ S.tags = clone(v.list || []); S.tagsUpdatedAt = ru; changed = true; }
      else if (sync.first && S.tagsUpdatedAt > ru) pushTags();
      continue;
    }
    if (d.id === 'board'){
      const ru = v.updatedAt || 0, lu = S.settings.boardUpdatedAt || 0;
      if (ru > lu){ takeBoard(v.list, ru); changed = true; }
      else if (sync.first && lu > ru) pushBoard();
      continue;
    }
    if (d.id[0] !== 'n') continue;
    const local = S.notes.get(d.id);
    if (!local || (v.updatedAt || 0) > (local.updatedAt || 0)){ S.notes.set(d.id, clone(v)); changed = true; }
    else if (sync.first && (local.updatedAt || 0) > (v.updatedAt || 0)) push(local.id);
  }
  if (sync.first){
    for (const n of S.notes.values()) if (!seen.has(n.id)) push(n.id);
    if (!seen.has('tags') && S.tags.length) pushTags();
    if (!seen.has('board') && S.settings.boardUpdatedAt) pushBoard();
    sync.first = false;
  }
  if (!sync.readonly) setSync('synced');
  if (changed){ saveLocal(); render(); }
}
function chain(key, fn){
  const prev = sync.chains.get(key) || Promise.resolve();
  const p = prev.then(fn).catch(e => {
    const c = e && e.code;
    if (c === 'quota_exceeded') toast('Your synced storage is full. Delete old notes or images to keep syncing.');
    else if (c === 'invalid_argument'){ sync.readonly = true; setSync('readonly'); }
    else if (c === 'revoked') setSync('error');

}
function push(id){ if (!IN_ARTIFACT) return schedulePush(); if (sync.col && !sync.readonly) chain(id, () => { const n = S.notes.get(id); return n ? sync.col.doc(id).set(clone(n)) : null; }); }
function pushBoard(){ if (!IN_ARTIFACT) return schedulePush(); if (sync.col && !sync.readonly) chain('board', () => sync.col.doc('board').set({ list: clone(S.settings.boardTags), updatedAt: S.settings.boardUpdatedAt || 0 })); }
function commitBoard(){ S.settings.boardUpdatedAt = Date.now(); saveSettings(); pushBoard(); }
function takeBoard(list, at){ S.settings.boardTags = clone(list || []); S.settings.boardUpdatedAt = at; saveSettings(); }
function pushTags(){ if (!IN_ARTIFACT) return schedulePush(); if (sync.col && !sync.readonly) chain('tags', () => sync.col.doc('tags').set({ list: clone(S.tags), updatedAt: S.tagsUpdatedAt })); }


/* ---------- sync (standalone copy: a private GitHub gist shared by your devices) ---------- */
const GIST_FILE = 'catchall.json', GIST_DESC = 'Catchall notes (sync data, edited by the app)';
const gist = { token: LS.get('ghToken', ''), id: LS.get('gistId', ''), imgId: LS.get('imgGistId', ''), owner: LS.get('ghOwner', ''), timer:null, busy:false, again:false, dirty:false, last:0,
  lastPull: 0, lastPush: LS.get('lastPush', 0), err: '', warned: false };
async function gh(path, opts = {}){
  const headers = { Authorization: 'Bearer ' + gist.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, { ...opts, headers, cache:'no-store' });
  if (r.status === 401) throw { code:'auth' };
  if (r.status === 403 || r.status === 404) throw { code:'scope', status:r.status };
  if (!r.ok) throw { code:'http', status:r.status };
  return r.json();
}
function snapshotData(){
  const cutoff = Date.now() - 120 * 864e5;
  const gone = [];
  for (const [id, n] of S.notes) if (n.deleted && n.updatedAt < cutoff){ gone.push(...(n.images || [])); S.notes.delete(id); }
  if (gone.length) trashImages(gone);
  return { app:'Catchall', v:1, savedAt: Date.now(), imgGist: gist.imgId || undefined, tags: S.tags, tagsUpdatedAt: S.tagsUpdatedAt, push: S.push, inbox: S.inbox, tz: Intl.DateTimeFormat().resolvedOptions().timeZone, board: { tags: S.settings.boardTags, updatedAt: S.settings.boardUpdatedAt || 0 }, notes: [...S.notes.values()] };
}
function mergeRemote(data){
  let changed = false, localNewer = false;
  if (!data || !Array.isArray(data.notes)) return { changed, localNewer: true };
  if (data.imgGist && data.imgGist !== gist.imgId){ gist.imgId = data.imgGist; LS.set('imgGistId', gist.imgId); changed = true; }
  else if (gist.imgId && !data.imgGist) localNewer = true;
  if ((data.tagsUpdatedAt || 0) > S.tagsUpdatedAt){ S.tags = data.tags || []; S.tagsUpdatedAt = data.tagsUpdatedAt; changed = true; }
  else if (S.tagsUpdatedAt > (data.tagsUpdatedAt || 0)) localNewer = true;
  const ri = data.inbox || {};
  if ((ri.updatedAt || 0) > S.inbox.updatedAt){ S.inbox = Object.assign({}, S.inbox, ri); changed = true; }
  else if (S.inbox.updatedAt > (ri.updatedAt || 0)) localNewer = true;
  const rp = data.push || {};
  if ((rp.updatedAt || 0) > S.push.updatedAt){ S.push = Object.assign({}, S.push, rp); changed = true; }
  else if (S.push.updatedAt > (rp.updatedAt || 0)) localNewer = true;
  const rb = data.board || {}, lb = S.settings.boardUpdatedAt || 0;
  if ((rb.updatedAt || 0) > lb || (rb.updatedAt === lb && lb === 1 && JSON.stringify(rb.tags) !== JSON.stringify(S.settings.boardTags))){ takeBoard(rb.tags, rb.updatedAt); changed = true; }
  else if (lb > (rb.updatedAt || 0)) localNewer = true;
  const seen = new Set();
  for (const n of data.notes){
    if (!n || !n.id) continue; seen.add(n.id);
    const l = S.notes.get(n.id);
    if (!l || (n.updatedAt || 0) > (l.updatedAt || 0)){ S.notes.set(n.id, n); changed = true; }
    else if ((l.updatedAt || 0) > (n.updatedAt || 0)) localNewer = true;
  }
  for (const id of S.notes.keys()) if (!seen.has(id)) localNewer = true;
  return { changed, localNewer };
}
async function readGist(){
  const g = await gh('/gists/' + gist.id);
  const owner = g.owner && g.owner.login; if (owner && owner !== gist.owner){ gist.owner = owner; LS.set('ghOwner', owner); }
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  let txt = f.content;
  if (f.truncated) txt = await (await fetch(f.raw_url, { cache:'no-store' })).text();
  try { return JSON.parse(txt || '{}'); } catch(e){ return null; }
}
async function syncNow(){
  if (!gist.token || !gist.id) return;
  if (gist.busy){ gist.again = true; return; }
  gist.busy = true;
  if (sync.state !== 'synced') setSync('connecting');
  try {
    const wasDirty = gist.dirty; gist.dirty = false;
    const remote = await readGist();
    gist.lastPull = Date.now();
    const { changed, localNewer } = mergeRemote(remote);
    if (changed){ saveLocal(); render(); }
    try { await syncImages(); } catch(e){ throw Object.assign({}, e, { saving: true }); }
    if (wasDirty || localNewer){
      try {
        await gh('/gists/' + gist.id, { method:'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(snapshotData()) } } }) });
      } catch(e){ throw Object.assign({}, e, { saving: true }); }
      gist.lastPush = Date.now(); LS.set('lastPush', gist.lastPush);
    }
    gist.last = Date.now(); gist.err = ''; setSync('synced');
  } catch(e){
    const c = e && e.code;
    if (c === 'auth'){ setSync('autherr'); gist.err = 'GitHub rejected the sync token on this device. It may have been deleted or expired. Tap Disconnect this device, then connect again with a new token.'; }
    else if (e && e.saving && c === 'scope'){ setSync('noscope'); gist.err = "This device can read your notes but GitHub won't let it save changes (error " + e.status + "). The token is missing the gist permission. Tap Disconnect this device, then connect again with a token made from the link in the steps, with the gist box ticked."; }
    else if (c === 'scope'){ setSync('autherr'); gist.err = "GitHub won't let this device open the sync data (error " + e.status + "). Tap Disconnect this device, then connect again with a token that has the gist box ticked."; }
    else { setSync('error'); gist.err = "Couldn't reach GitHub" + (e && e.status ? ' (error ' + e.status + ')' : '') + '. Changes are kept here and will go through when the connection is back.'; }
    if (c !== 'auth') gist.dirty = true;
    if (!gist.warned && c !== 'http' && e && e.code){ gist.warned = true; toast("Changes on this device aren't reaching your other devices. Open Settings → Sync across devices to see why.", { ms: 12000 }); }

function schedulePush(){ if (!gist.id) return; gist.dirty = true; clearTimeout(gist.timer); gist.timer = setTimeout(syncNow, 1200); }
async function connectGist(token){
  gist.token = token.trim();
  let found = null;
  for (let page = 1; page <= 5 && !found; page++){
    const list = await gh('/gists?per_page=100&page=' + page);
    found = list.find(g => g.description === GIST_DESC && g.files && g.files[GIST_FILE]);
    if (list.length < 100) break;
  }
  if (!found) found = await gh('/gists', { method:'POST', body: JSON.stringify({ description: GIST_DESC, public:false, files: { [GIST_FILE]: { content: JSON.stringify(snapshotData()) } } }) });
  gist.id = found.id;
  LS.set('ghToken', gist.token); LS.set('gistId', gist.id);
  gist.dirty = true; await syncNow();
  return found;
}
function disconnectGist(){ gist.token = ''; gist.id = ''; gist.imgId = ''; LS.set('imgGistId', ''); LS.set('ghToken', ''); LS.set('gistId', ''); setSync('local'); }
function initGist(){
  if (!gist.token || !gist.id){ setSync('local'); return; }
  syncNow();
  clearInterval(window.__catchallPull);
  window.__catchallPull = setInterval(() => { if (!document.hidden) syncNow(); }, 45000);
}
document.addEventListener('visibilitychange', () => { if (!IN_ARTIFACT && !document.hidden && gist.id) syncNow(); });
window.addEventListener('focus', () => { if (!IN_ARTIFACT && gist.id && Date.now() - gist.last > 10000) syncNow(); });
window.addEventListener('pagehide', () => { if (!IN_ARTIFACT && gist.dirty) { clearTimeout(gist.timer); syncNow(); } });
async function showQR(text = gist.token, boxId = 'qrBox', caption){

function agoText(t){

function syncSectionHTML(){

/* ---------- photos (standalone copy) ----------
   Photos are kept at full quality in IndexedDB, not inside the notes, so the notes stay small.
   A note stores "img:<id>" references. Each photo syncs as one text file (a data URL) in a
   second private gist; other devices download it from the gist's raw URL when they need it.
   The Claude copy keeps the older small inline images. */
const IMG_DESC = 'Catchall photos (sync data, edited by the app)';
const BLANK_IMG = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const isRef = v => typeof v === 'string' && v.startsWith('img:');
const imgFile = ref => ref.slice(4) + '.txt';
let imgDBp = null;
function imgDB(){
  return imgDBp || (imgDBp = new Promise((res, rej) => {
    const r = indexedDB.open('catchall-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result); r.onerror = () => { imgDBp = null; rej(r.error); };
  }));
}
async function idb(mode, fn){
  const db = await imgDB();
  return new Promise((res, rej) => { const tx = db.transaction('img', mode), r = fn(tx.objectStore('img')); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); });
}
const imgPut = (ref, d) => idb('readwrite', st => st.put(d, ref));
const imgGet = ref => idb('readonly', st => st.get(ref)).catch(() => null);
const imgDel = ref => idb('readwrite', st => st.delete(ref)).catch(() => {});
const imgURL = new Map(), imgLoading = new Map(), imgFailedAt = new Map();
const imgSrc = v => isRef(v) ? (imgURL.get(v) || BLANK_IMG) : v;
async function imgData(ref){ return (await imgGet(ref)) || (await fetchRemoteImg(ref)); }
function loadImg(ref){
  if (imgURL.has(ref)) return Promise.resolve(imgURL.get(ref));
  if (Date.now() - (imgFailedAt.get(ref) || 0) < 30e3) return Promise.resolve('');
  if (!imgLoading.has(ref)) imgLoading.set(ref, (async () => {
    const d = await imgData(ref);
    imgLoading.delete(ref);
    if (!d){ imgFailedAt.set(ref, Date.now()); return ''; }
    const u = URL.createObjectURL(await (await fetch(d)).blob());
    imgURL.set(ref, u); return u;
  })());
  return imgLoading.get(ref);
}
function hydrateImgs(root = document){
  root.querySelectorAll('img[data-ref]').forEach(async el => {
    const ref = el.dataset.ref; if (imgURL.has(ref)){ el.src = imgURL.get(ref); return; }
    el.classList.add('loading');
    const u = await loadImg(ref);
    if (u && el.dataset.ref === ref){ el.src = u; el.classList.remove('loading'); }
  });
}
const imgTag = (v, extra = '') => `<img src="${esc(imgSrc(v))}" ${isRef(v) ? `data-ref="${esc(v)}"` : ''} ${extra}>`;
async function storePhoto(dataUrl){ const ref = uid('img:'); await imgPut(ref, dataUrl); return ref; }

const imgSync = { uploaded: new Set(LS.get('imgUploaded', [])), trash: new Set(LS.get('imgTrash', [])) };
function markUploaded(ref){ if (!imgSync.uploaded.has(ref)){ imgSync.uploaded.add(ref); LS.set('imgUploaded', [...imgSync.uploaded]); } }
function trashImages(refs){
  const live = new Set(); for (const n of S.notes.values()) for (const v of n.images || []) live.add(v);
  for (const r of refs) if (isRef(r) && !live.has(r)){ imgSync.trash.add(r); imgDel(r); }
  LS.set('imgTrash', [...imgSync.trash]);
}
async function fetchRemoteImg(ref){
  if (IN_ARTIFACT || !gist.imgId || !gist.owner) return null;
  try {
    const r = await fetch(`https://gist.githubusercontent.com/${encodeURIComponent(gist.owner)}/${gist.imgId}/raw/${encodeURIComponent(imgFile(ref))}`, { cache:'no-store' });
    if (!r.ok) return null;
    const d = (await r.text()).trim();
    if (!d.startsWith('data:image/')) return null;
    await imgPut(ref, d); markUploaded(ref);
    return d;
  } catch(e){ return null; }
}
async function ensureImgGist(){
  if (gist.imgId) return gist.imgId;
  let found = null;
  for (let page = 1; page <= 5 && !found; page++){
    const list = await gh('/gists?per_page=100&page=' + page);
    found = list.find(g => g.description === IMG_DESC);
    if (list.length < 100) break;
  }
  if (!found) found = await gh('/gists', { method:'POST', body: JSON.stringify({ description: IMG_DESC, public:false, files: { 'README.md': { content: 'Photos attached to Catchall notes. Each file is one photo. The app adds and removes these files; please leave them alone.' } } }) });
  gist.imgId = found.id; LS.set('imgGistId', gist.imgId);
  return gist.imgId;
}
// Upload any photo a note uses that this device hasn't sent yet, and remove photos no note uses.
async function syncImages(){
  const todo = new Set();
  for (const n of S.notes.values()) if (!n.deleted) for (const v of n.images || []) if (isRef(v) && !imgSync.uploaded.has(v)) todo.add(v);
  if (!todo.size && !imgSync.trash.size) return;
  await ensureImgGist();
  for (const ref of todo){
    const d = await imgGet(ref); if (!d) continue;
    await gh('/gists/' + gist.imgId, { method:'PATCH', body: JSON.stringify({ files: { [imgFile(ref)]: { content: d } } }) });
    markUploaded(ref);
  }
  if (imgSync.trash.size){
    const files = {}; for (const r of imgSync.trash) files[imgFile(r)] = null;
    try { await gh('/gists/' + gist.imgId, { method:'PATCH', body: JSON.stringify({ files }) }); } catch(e){ if (!e || e.status !== 422) throw e; }
    imgSync.trash.clear(); LS.set('imgTrash', []);
  }
}

/* ---------- mutations ---------- */
function putNote(n){ const prev = S.notes.get(n.id); n.updatedAt = Date.now(); S.notes.set(n.id, n); saveLocal(); push(n.id); notifyChange(prev, n); }
function delNote(id){ const prev = S.notes.get(id); S.notes.set(id, { id, deleted:true, updatedAt: Date.now(), images: (prev && prev.images || []).filter(isRef) }); saveLocal(); push(id); notifyChange(prev, S.notes.get(id)); }

/* ---------- phone push notifications (standalone copy, via the ntfy app) ----------
   ntfy.sh can't take back a queued message, so a reminder is only queued in the
   45 minutes before it's due: by any open copy of Catchall, or by the repo's GitHub
   Action (every 15 min). remind.queued records the time already queued, so the other
   side skips it. The note id is the ntfy sequence id, so a repeat shows as one notification. */
const NTFY = 'https://ntfy.sh/', APP_URL = 'https://krackenc.github.io/catchall/', PUSH_AHEAD = 45 * 60e3;
const pushReady = () => !IN_ARTIFACT && S.push.enabled && !!S.push.topic;
const activeRem = n => !!(n && !n.deleted && !n.archived && n.remind && !n.remind.sent);
const remKey = n => activeRem(n) ? [n.remind.at, n.remind.repeat || '', n.text || '', (n.items || []).length].join('|') : '';
const notifyLabel = n => n.kind === 'list' ? (n.text || (n.items || []).map(i => i.t).join(', ') || 'List') : (n.text || 'Reminder');
function ntfy(id, opts){ return fetch(NTFY + encodeURIComponent(S.push.topic) + (id ? '/' + id : ''), opts); }
const queuing = new Set();
function notifySchedule(n){
  if (!pushReady() || !activeRem(n)) return;
  const now = Date.now(); let at = n.remind.at;
  if (at <= now + 15e3 && n.remind.repeat) at = nextOccurrence(at, n.remind.repeat, now);
  if (at <= now + 15e3 || at - now > PUSH_AHEAD || n.remind.queued === at || queuing.has(n.id + '@' + at)) return;
  queuing.add(n.id + '@' + at);
  ntfy(n.id, { method:'POST', body: S.push.showText ? notifyLabel(n) : 'Open Catchall to see it.',
    headers: { Title:'Catchall reminder', At: String(Math.floor(at / 1000)), Tags:'pushpin', Priority:'4', Click: APP_URL } })
    .then(r => {
      if (!r.ok) { queuing.delete(n.id + '@' + at); return; }
      const cur = S.notes.get(n.id);
      if (activeRem(cur)){ cur.remind = { ...cur.remind, queued: at }; cur.updatedAt = Date.now(); saveLocal(); push(cur.id); }
    })
    .catch(() => queuing.delete(n.id + '@' + at));
}
function notifyChange(prev, n){ if (pushReady() && remKey(prev) !== remKey(n) && activeRem(n)) notifySchedule(n); }
function notifyAll(){ if (pushReady()) for (const n of liveNotes()) notifySchedule(n); }
function setPush(patch){ Object.assign(S.push, patch, { updatedAt: Date.now() }); saveLocal(); schedulePush(); }
/* ---------- Save from iPhone (standalone copy) ----------
   The "Save to Catchall" shortcut (Share sheet or "Hey Siri") posts what you give it to a private
   ntfy topic. Any open copy of Catchall, and the repo's background job, turn each message into a
   note. A message's ntfy id becomes the note id, so two devices filing the same message make one note.
   ntfy.sh keeps messages for 12 hours, which the background job covers. */
const inboxReady = () => !IN_ARTIFACT && S.inbox.enabled && !!S.inbox.topic;
const inboxAddress = () => NTFY + S.inbox.topic;
let inboxBusy = false, inboxLast = 0;
async function pullInbox(force){
  if (!inboxReady() || inboxBusy || (!force && Date.now() - inboxLast < 30e3)) return 0;
  inboxBusy = true; inboxLast = Date.now(); let added = 0;
  try {
    const r = await fetch(`${NTFY}${encodeURIComponent(S.inbox.topic)}/json?poll=1&since=24h`, { cache:'no-store' });
    if (!r.ok) return 0;
    const lines = (await r.text()).split('\n').filter(Boolean);
    for (const line of lines){
      let m; try { m = JSON.parse(line); } catch(e){ continue; }
      if (m.event !== 'message') continue;
      const id = 'nx' + m.id;
      if (S.notes.has(id)) continue;
      const raw = [m.title, m.message].filter(x => x && x !== 'triggered').join('\n').trim();
      let images = [];
      if (m.attachment && /^image\//.test(m.attachment.type || '') && !IN_ARTIFACT){
        try { const blob = await (await fetch(m.attachment.url)).blob(); let d = await compress(blob, 2048, .85); if (d.length > 1.6e6) d = await compress(blob, 1600, .8); images = [await storePhoto(d)]; } catch(e){}
      }
      if (!raw && !images.length) continue;
      const pc = parseCapture(raw || '');
      const tags = [...pc.tagIds];
      for (const name of pc.newTags){ const t = ensureTag(name); if (t && !tags.includes(t.id)) tags.push(t.id); }
      const at = (m.time || Date.now() / 1000) * 1000;
      putNote({ id, kind: pc.kind, text: pc.text, items: pc.items, tags, pinned:false, archived:false, createdAt: at, updatedAt: at, remind: pc.remind, images, via:'iphone' });
      added++;
    }
  } catch(e){ /* offline: try again later */ }
  finally { inboxBusy = false; }
  if (added){ render(); toast(added === 1 ? 'Saved 1 note from your iPhone' : `Saved ${added} notes from your iPhone`); }
  return added;
}

function ensureTag(name){

/* images */
async function compress(file, maxDim, q){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
async function addImages(files){
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  for (const f of imgs){
    if (S.ui.pending.length >= 4){ toast('Up to 4 images per note.'); break; }
    try {
      if (IN_ARTIFACT){
        let d = await compress(f, 1100, .72);
        if (d.length > 52000) d = await compress(f, 800, .62);
        if (d.length > 52000) d = await compress(f, 560, .55);
        S.ui.pending.push(d);
      } else {
        // sharp enough to read labels and part numbers; about 0.3 to 0.9 MB per photo
        let d = await compress(f, 2048, .85);
        if (d.length > 1.6e6) d = await compress(f, 1600, .8);
        S.ui.pending.push(await storePhoto(d));
      }
    } catch(e){ toast('That image could not be read. Try a JPEG or PNG.'); }
  }
  renderThumbs(); updatePreview(); hydrateImgs();
}

/* ---------- reminders engine ---------- */
let audioCtx = null;
document.addEventListener('pointerdown', () => { if (!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } }, { once:true });
function chime(){
  if (!S.settings.sound || !audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    [880, 1318.5].forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0, t + i * .18); g.gain.linearRampToValueAtTime(.18, t + i * .18 + .02); g.gain.exponentialRampToValueAtTime(.001, t + i * .18 + .6);
      o.connect(g).connect(audioCtx.destination); o.start(t + i * .18); o.stop(t + i * .18 + .65); });
  } catch(e){}
}
const alerted = new Set();
function tick(){
  if (!document.hidden){ notifyAll(); pullInbox(); }
  const now = Date.now(); let any = false;
  for (const n of liveNotes()){
    const r = n.remind;
    if (!r || r.sent || r.at > now) continue;
    const key = n.id + '@' + r.at;
    if (alerted.has(key)) continue;
    alerted.add(key); any = true;
    const label = n.kind === 'list' ? (n.text || 'List') : (n.text || 'Reminder');
    toast(label, { alarm: n.id });
    chime();
    if ('Notification' in window && Notification.permission === 'granted'){ try { new Notification('Catchall', { body: label }); } catch(e){} }
  }
  if (any || document.title.startsWith('(') !== liveNotes().some(n => n.remind && !n.remind.sent && n.remind.at <= now)) render();
}
function completeReminder(id, snoozeMin){
  const n = S.notes.get(id); if (!n || !n.remind) return;
  const r = { ...n.remind };
  if (snoozeMin) r.at = Date.now() + snoozeMin * 60e3;
  else if (r.repeat) r.at = nextOccurrence(r.at, r.repeat);
  else r.sent = true;
  putNote({ ...n, remind: r.sent && S.settings.sentRem === 'clear' ? null : r }); render();
}

/* ---------- toasts ---------- */
/* One message at a time: a new message replaces the previous one (reminder alarms keep their own
   place). Saves made in quick succession count up in a single message whose Undo removes the last. */
const saveRun = { el: null, n: 0 };
function toast(msg, opt = {}){
  const box = $('#toasts'), el = document.createElement('div');
  if (opt.key === 'save'){
    saveRun.n = saveRun.el && saveRun.el.isConnected ? saveRun.n + 1 : 1;
    if (saveRun.n > 1){ msg = `Saved ${saveRun.n} notes`; opt.undoLabel = 'Undo last'; }
    saveRun.el = el;
  }
  if (!opt.alarm) box.querySelectorAll('.toast:not(.alarm)').forEach(t => t.remove());
  el.className = 'toast' + (opt.alarm ? ' alarm' : '');
  el.innerHTML = `${opt.alarm ? icon('bell') : ''}<span class="msg"></span>`;
  el.querySelector('.msg').textContent = msg;
  const btn = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = () => { fn(); el.remove(); }; el.appendChild(b); };
  if (opt.undo) btn(opt.undoLabel || 'Undo', () => { delNote(opt.undo); render(); });
  if (opt.undoFn) btn('Undo', opt.undoFn);
  if (opt.restore) btn('Undo', () => { putNote(clone(opt.restore)); render(); toast('Note restored'); });
  if (opt.alarm){ btn('Snooze 10 min', () => completeReminder(opt.alarm, 10)); btn('Done', () => completeReminder(opt.alarm)); }
  else btn('Dismiss', () => {});
  box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  if (!opt.alarm) setTimeout(() => el.remove(), opt.ms || (opt.undo || opt.restore || opt.undoFn ? 7000 : 4000));
}

async function withPhotos(ns){
  return Promise.all(ns.map(async n => (n.images || []).some(isRef) ? { ...n, images: (await Promise.all(n.images.map(async v => isRef(v) ? await imgData(v) : v))).filter(Boolean) } : n));
}
async function exportNotes(fmt){
  const scope = $('#expScope')?.value || 'all';
  let ns = liveNotes();
  if (scope === 'view') ns = ns.filter(matches); else if (scope === 'pinned') ns = ns.filter(n => n.pinned);
  ns.sort((a, b) => a.createdAt - b.createdAt);
  const tn = n => (n.tags || []).map(id => tagById(id)?.name).filter(Boolean);
  const stamp = new Date().toISOString().slice(0, 10);
  let data, name;
  if (fmt === 'json'){ data = JSON.stringify({ app:'Catchall', version:1, exportedAt:new Date().toISOString(), tags:S.tags, notes: await withPhotos(ns) }, null, 2); name = `catchall-backup-${stamp}.json`; }
  else if (fmt === 'csv'){
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    data = 'created,text,checklist,tags,pinned,archived,reminder,repeat,images\n' + ns.map(n => [new Date(n.createdAt).toISOString(), n.text, (n.items || []).map(i => (i.done ? '[x] ' : '[ ] ') + i.t).join(' | '), tn(n).join(' '), n.pinned ? 'yes' : '', n.archived ? 'yes' : '', n.remind ? new Date(n.remind.at).toISOString() : '', n.remind?.repeat || '', (n.images || []).length].map(q).join(',')).join('\n');
    name = `catchall-${stamp}.csv`;
  } else {
    let out = `# Catchall notes\n\nExported ${new Date().toLocaleString()}\n`, cur = '';
    for (const n of ns){
      const d = fDay(n.createdAt); if (d !== cur){ out += `\n## ${new Date(n.createdAt).toLocaleDateString([], { weekday:'long', year:'numeric', month:'long', day:'numeric' })}\n\n`; cur = d; }
      out += `- **${fTime(n.createdAt)}** ${n.text ? n.text.replace(/\n/g, '\n  ') : ''}${tn(n).map(t => ' #' + t).join('')}${n.pinned ? ' (pinned)' : ''}${n.remind ? ` (reminder ${fWhen(n.remind.at)}${n.remind.repeat ? ', ' + REPEAT_LABEL[n.remind.repeat] : ''})` : ''}${(n.images || []).length ? ` (${n.images.length} image${n.images.length > 1 ? 's' : ''})` : ''}\n`;
      for (const i of n.items || []) out += `  - [${i.done ? 'x' : ' '}] ${i.t}\n`;
    }
    data = out; name = `catchall-${stamp}.md`;
  }
  deliver(name, data);
}
async function deliver(name, data){
  if (IN_ARTIFACT){
    let dl = null; try { dl = await claude.use('downloads'); } catch(e){}
    if (dl){
      try { await dl.save({ filename: name, data }); toast('Export saved'); } catch(e){ if (e && e.code !== 'declined') copyFallback(data); }
      return;
    }
    copyFallback(data); return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type:'text/plain' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Export downloaded');
}
function copyFallback(data){
  navigator.clipboard?.writeText(data).then(() => toast('Downloads are unavailable here, so the export was copied to your clipboard.'), () => toast('Export is unavailable in this view.'));
}
async function importFile(file){
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.notes)) throw 0;
    let added = 0;
    for (const t of j.tags || []) if (t && t.id && !tagById(t.id)) { S.tags.push(t); }
    commitTags();
    for (const n of j.notes){
      if (!n || !n.id || n.deleted) continue;
      const cur = S.notes.get(n.id);
      if (!cur || cur.deleted || (n.updatedAt || 0) > (cur.updatedAt || 0)){
        if (!IN_ARTIFACT && (n.images || []).length) n.images = await Promise.all(n.images.map(v => typeof v === 'string' && v.startsWith('data:image/') ? storePhoto(v) : v));
        S.notes.set(n.id, n); push(n.id); added++;
      }
    }
    saveLocal(); render(); openSettings(); toast(`Restored ${added} note${added === 1 ? '' : 's'}`);
  } catch(e){ toast("That file isn't a Catchall JSON backup."); }
}
