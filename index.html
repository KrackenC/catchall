  else if ((e.key === 'n' || e.key === 'c') && !e.metaKey && !e.ctrlKey && $('#cap')){ e.preventDefault(); $('#cap').focus(); }
});
$('#edForm').addEventListener('submit', e => { e.preventDefault(); saveEditor(); });
$('#lbDlg').addEventListener('click', e => {
  const dlg = $('#lbDlg'), b = e.target.closest('[data-lb]');
  const zoom = on => { dlg.classList.toggle('zoomed', on); const l = dlg.querySelector('[data-lb="zoom"] span'); if (l) l.textContent = on ? 'Fit to screen' : 'Zoom in'; };
  if (b && b.dataset.lb === 'close') dlg.close();
  else if (b && b.dataset.lb === 'zoom') zoom(!dlg.classList.contains('zoomed'));
  else if (e.target.tagName === 'IMG') zoom(!dlg.classList.contains('zoomed'));
  else if (e.target === dlg) dlg.close();
});
document.addEventListener('paste', e => {
  if (e.target.id !== 'cap') return;
  const files = [...(e.clipboardData?.files || [])];
  if (files.length && (!IN_ARTIFACT || files.some(f => f.type.startsWith('image/')))){ e.preventDefault(); addImages(files); }
});
document.addEventListener('dragover', e => {
  const comp = e.target.closest?.('#composer');
  if (comp && [...(e.dataTransfer?.types || [])].includes('Files')){ e.preventDefault(); comp.classList.add('drag'); return; }
  const col = e.target.closest?.('.bcol');
  if (col && S.ui.drag){ e.preventDefault(); document.querySelectorAll('.bcol.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); }
});
document.addEventListener('dragleave', e => { const c = e.target.closest?.('#composer, .bcol'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('drag', 'over'); });
document.addEventListener('dragstart', e => { const card = e.target.closest?.('.note[draggable]'); if (!card) return; S.ui.drag = { id: card.dataset.id, from: card.closest('.bcol').dataset.col }; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', card.dataset.id); } catch(_){} });
document.addEventListener('dragend', () => { S.ui.drag = null; document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });
document.addEventListener('drop', e => {
  const comp = e.target.closest?.('#composer');
  if (comp && e.dataTransfer?.files?.length){ e.preventDefault(); comp.classList.remove('drag'); addImages(e.dataTransfer.files); return; }
  const col = e.target.closest?.('.bcol'); const dr = S.ui.drag;
  if (!col || !dr) return;
  e.preventDefault();
  const n = S.notes.get(dr.id); if (!n) return;
  if (col.dataset.col === '__archive'){ putNote({ ...n, archived:true }); toast('Archived'); }
  else if (col.dataset.col !== dr.from){ const tags = (n.tags || []).filter(x => x !== dr.from); if (!tags.includes(col.dataset.col)) tags.push(col.dataset.col); putNote({ ...n, tags }); }
  S.ui.drag = null; render();
});

/* dictation (works on the standalone copy; the Claude viewer blocks the microphone) */
/* The composer is redrawn on every render (saving, syncing), so always look up the live
   textarea and button instead of holding on to the ones that existed when dictation began. */
let rec = null, recBase = '', recTimer = 0;
const MIC_ERRORS = {
  'not-allowed': 'The microphone is blocked for Catchall. Click the icon at the left of the address bar (in the app window: the ⋮ menu → Site settings), set Microphone to Allow, then press Dictate again.',
  'service-not-allowed': 'The microphone is blocked for Catchall. Click the icon at the left of the address bar (in the app window: the ⋮ menu → Site settings), set Microphone to Allow, then press Dictate again.',
  'audio-capture': 'No microphone was found. Check that one is plugged in and selected in System Settings → Sound → Input.',
  'network': 'Dictation needs an internet connection. Try again once you\'re online.'
};
function micUI(){
  const b = $('#micBtn'); if (!b) return;
  b.setAttribute('aria-pressed', rec ? 'true' : 'false');
  b.querySelector('span').textContent = rec ? 'Stop' : 'Dictate';
}
function stopDictation(){
  if (!rec) return;
  const r = rec; rec = null; clearTimeout(recTimer);
  try { r.abort(); } catch(e){}
  micUI(); recUI(); memoUI();
}
/* iPhone and iPad give Home Screen apps no speech recognition, so there the button points
   to the keyboard's own microphone key, which works in any text box. */
function dictHintHTML(){
  return `<p class="dict-hint" role="status">${icon('mic')}<span>Tap the <b>microphone key</b> on your keyboard (next to the space bar, or bottom right) and start talking. Tap it again when you're done. No mic key? Turn on Settings → General → Keyboard → Enable Dictation.</span><button type="button" class="act" data-act="dicthintx">Got it</button></p>`;
}
function keyboardDictation(){
  const c = $('#cap'); if (!c) return;
  c.focus();
  S.ui.dictHint = true;
  if (!$('.dict-hint')) c.insertAdjacentHTML('afterend', dictHintHTML());
}
function dictate(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (IS_IOS || !SR) return keyboardDictation();
  if (rec){
    const r = rec;
    try { r.stop(); } catch(e){}
    // if the browser never reports the end, release it anyway so the button works again
    clearTimeout(recTimer); recTimer = setTimeout(() => { if (rec === r){ rec = null; micUI(); } }, 1500);
    return;
  }
  const c = $('#cap'); if (!c) return;
  recBase = c.value ? c.value.replace(/\s*$/, ' ') : '';
  const r = new SR(); r.interimResults = true; r.continuous = !IS_PHONE; // Android repeats words in continuous mode r.lang = navigator.language || 'en-US';
  r.onresult = ev => {
    if (rec !== r) return;
    const c = $('#cap'); if (!c) return;
    let t = ''; for (const x of ev.results) t += x[0].transcript;
    c.value = recBase + t.trimStart(); autosize(); updatePreview();
  };
  r.onerror = ev => {
    if (rec !== r) return;
    if (IS_PHONE && /not-allowed|network/.test(ev.error)){ rec = null; micUI(); keyboardDictation(); return; }
    if (MIC_ERRORS[ev.error]) toast(MIC_ERRORS[ev.error], { ms: 12000 });
  };
  r.onend = () => { if (rec === r){ rec = null; clearTimeout(recTimer); micUI(); $('#cap')?.focus(); } };
  rec = r;
  try { r.start(); } catch(e){ rec = null; toast('Dictation couldn\'t start. Press Dictate to try again.'); }
  micUI(); recUI(); memoUI();
}

/* Swipe the Sort card: right keeps it, left archives (or deletes, per Settings). */
(() => {
  let sx = 0, sy = 0, card = null;
  document.addEventListener('touchstart', e => { card = e.target.closest('[data-sortcard]'); if (!card) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; card.style.transition = 'none'; }, { passive:true });
  document.addEventListener('touchmove', e => { if (!card) return; const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy; if (Math.abs(dy) > Math.abs(dx)) return; card.style.transform = `translateX(${dx}px)`; card.dataset.dir = dx > 40 ? 'keep' : dx < -40 ? 'left' : ''; }, { passive:true });
  document.addEventListener('touchend', e => {
    if (!card) return; const c = card; card = null; c.style.transition = '';
    const dx = (e.changedTouches[0]?.clientX || sx) - sx;
    if (Math.abs(dx) < 90){ c.style.transform = ''; c.dataset.dir = ''; return; }
    sortNext(c.dataset.sortcard, dx > 0 ? 'keep' : (S.settings.swipeLeft === 'delete' ? 'delete' : 'archive'));
  });
})();

/* ---------- boot ---------- */
$('#brandmark').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-7 12 13)"><path d="M4 5h16v11l-5 5H4z" fill="#ffd648"/><path d="M15 21v-5h5z" fill="#e2b228"/></g><circle cx="12" cy="6.2" r="3.1" fill="#e5484d"/><circle cx="11" cy="5.2" r="1" fill="#ff9696"/></svg>';
$('#openSettings').innerHTML = icon('gear') + '<span>Settings</span>';
if (!IN_ARTIFACT) $('#fileImg').removeAttribute('accept'); // photos and any other file
$('#openSettings').addEventListener('click', openSettings);
$('#sync').addEventListener('click', () => openSettings('sync'));
window.addEventListener('resize', autosize);
render();
clearInterval(window.__catchallTick); window.__catchallTick = setInterval(tick, 15000); setTimeout(tick, 800);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
initSync();
// Tells the update script when installing a new version now would interrupt something.
window.__appBusy = () => S.ui.pending.length > 0 || S.ui.pendingFiles.length > 0 || !!recM || !!($('#cap') && $('#cap').value.trim()) || !!document.querySelector('dialog[open]');
window.__catchallTest = { parseReminder, parseCapture, parseStructure, nextOccurrence };
})();
</script>

<div id="__update-banner" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99999;background:var(--shell,#2f5a3c);color:var(--shell-fg,#eef5e6);font:600 14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -2px 12px rgb(var(--sh-rgb,0 0 0)/.35);">
  <span id="__update-msg">A newer version of Catchall is available.</span>
  <span id="__update-actions" style="display:flex;gap:8px;flex-shrink:0;">
    <button id="__update-btn" style="font:700 13px/1 -apple-system,sans-serif;background:var(--surface,#f8fbf3);color:var(--fg,#242b25);border:0;border-radius:4px;padding:8px 14px;cursor:pointer;">Update</button>
    <button id="__dismiss-btn" style="font:600 13px/1 -apple-system,sans-serif;background:transparent;color:var(--shell-fg,#eef5e6);border:1px solid var(--shell-line,rgba(255,255,255,.24));border-radius:4px;padding:8px 14px;cursor:pointer;">Later</button>
  </span>
</div>
<script>
(function () {
  var CURRENT_VERSION = "37";
  var banner = document.getElementById('__update-banner');
  var updateBtn = document.getElementById('__update-btn');
  var dismissBtn = document.getElementById('__dismiss-btn');

  var lastCheck = 0, applying = false;
  // Phones (iPhone/iPad Home Screen apps especially) must never navigate here: a reload or
  // URL change can hand the app a fresh, empty storage container, which once wiped notes.
  // So on phones the new page is swapped in place. Computers reload normally, which is safe.
  var isPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  function busy() {
    if (typeof window.__appBusy === 'function') { try { return !!window.__appBusy(); } catch (e) {} }
    var a = document.activeElement;
    return !!document.querySelector('dialog[open]') || !!(a && /INPUT|TEXTAREA/.test(a.tagName) && a.value);
  }
  function showBanner() { banner.style.display = 'flex'; }
  // Fetch the page past every cache (GitHub's CDN can serve the old page for ~10 minutes after
  // a deploy) and only accept it if it really is the version version.json announced.
  function applyUpdate(want) {
    if (applying) return Promise.resolve(false);
    applying = true;
    return fetch('./?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (html) {
        if (want && html.indexOf('CURRENT_VERSION = "' + want + '"') < 0) throw new Error('not live yet');
        try { sessionStorage.setItem('__updatedTo', want || ''); } catch (e) {}
        // Refresh the browser's stored copy so the next launch opens the new version too.
        return fetch('./', { cache: 'reload' }).then(function (r) { return r.ok ? r.text() : ''; }, function () { return ''; })
          .then(function (stored) {
            if (!isPhone && stored.indexOf('CURRENT_VERSION = "' + want + '"') >= 0) { location.reload(); return true; }
            document.open(); document.write(html); document.close();
            return true;
          });
      })
      .catch(function () { applying = false; return false; });
  }
  function checkVersion(auto) {
    lastCheck = Date.now();
    return fetch('./version.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        var newer = !!(data && data.version && data.version !== CURRENT_VERSION);
        if (!newer) return false;
        // On launch or when the app comes back to the front, install it straight away unless
        // the person is in the middle of something; otherwise offer the Update button.
        if (auto === true && !busy()) return applyUpdate(data.version).then(function (ok) { if (!ok) showBanner(); return true; });
        banner.dataset.want = data.version;
        showBanner();
        return true;
      })
      .catch(function () { return null; /* offline or blocked -- say nothing */ });
  }
  window.__appVersion = CURRENT_VERSION;
  window.__checkForUpdate = checkVersion;

  updateBtn.addEventListener('click', function () {
    updateBtn.textContent = 'Updating…';
    updateBtn.disabled = true;
    applyUpdate(banner.dataset.want).then(function (ok) {
      if (ok) return;
      updateBtn.textContent = 'Update';
      updateBtn.disabled = false;
      document.getElementById('__update-msg').textContent = 'The new version is still reaching GitHub. Try again in a minute.';
    });
  });

  // Say so after an update, so it's clear it happened.
  try {
    var to = sessionStorage.getItem('__updatedTo');
    if (to) {
      sessionStorage.removeItem('__updatedTo');
      if (to === CURRENT_VERSION) {
        document.getElementById('__update-msg').textContent = 'Catchall updated to version ' + CURRENT_VERSION + '.';
        document.getElementById('__update-actions').style.display = 'none';
        showBanner();
        setTimeout(function () { banner.style.display = 'none'; document.getElementById('__update-actions').style.display = 'flex'; document.getElementById('__update-msg').textContent = 'A newer version of Catchall is available.'; }, 4000);
      }
    }
  } catch (e) {}

  dismissBtn.addEventListener('click', function () {
    banner.style.display = 'none';
  });

  if (document.readyState === 'complete') {
    checkVersion(true);
  } else {
    addEventListener('load', function () { checkVersion(true); });
  }
  // A desktop app window never becomes "hidden" when you click another window, so also check on focus and every 15 minutes.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkVersion(true); });
  addEventListener('focus', function () { if (Date.now() - lastCheck > 60000) checkVersion(); });
  clearInterval(window.__updateTimer);
  window.__updateTimer = setInterval(checkVersion, 15 * 60 * 1000);
})();
</script>
</body>
